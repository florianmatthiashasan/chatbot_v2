{% extends "base.html" %}
{% block title %}PDF Upload - florianmatthias{% endblock %}

{% block content %}
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
    const { useState, useRef } = React;
    const h = React.createElement;

    const Icon = ({ name }) => {
        const props = { viewBox: "0 0 24 24", "aria-hidden": "true" };
        switch (name) {
            case "dashboard":
                return h("svg", props, [
                    h("rect", { x: 3, y: 3, width: 8, height: 8, rx: 2 }),
                    h("rect", { x: 13, y: 3, width: 8, height: 5, rx: 2 }),
                    h("rect", { x: 13, y: 10, width: 8, height: 11, rx: 2 }),
                    h("rect", { x: 3, y: 13, width: 8, height: 8, rx: 2 }),
                ]);
            case "stats":
                return h("svg", props, [
                    h("path", { d: "M3 19h18" }),
                    h("path", { d: "M6 16v-5" }),
                    h("path", { d: "M12 16v-8" }),
                    h("path", { d: "M18 16v-3" }),
                ]);
            case "scraping":
                return h("svg", props, [
                    h("path", { d: "M21 12a9 9 0 1 1-3-6.7" }),
                    h("polyline", { points: "21 3 21 9 15 9" }),
                ]);
            case "chat":
                return h("svg", props, [
                    h("path", { d: "M6 6h12a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H10l-4 3v-3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z" }),
                ]);
            case "memory":
                return h("svg", props, [
                    h("ellipse", { cx: 12, cy: 6, rx: 7, ry: 3 }),
                    h("path", { d: "M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6" }),
                    h("path", { d: "M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" }),
                ]);
            case "faqs":
                return h("svg", props, [
                    h("circle", { cx: 12, cy: 12, r: 9 }),
                    h("path", { d: "M9.5 9a2.5 2.5 0 0 1 5 0c0 1.6-2.5 1.9-2.5 4" }),
                    h("path", { d: "M12 17h.01" }),
                ]);
            case "pdf":
                return h("svg", props, [
                    h("path", { d: "M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" }),
                    h("path", { d: "M14 3v5h5" }),
                    h("path", { d: "M9 13h6" }),
                    h("path", { d: "M9 17h6" }),
                ]);
            case "widget":
                return h("svg", props, [
                    h("path", { d: "M4 6h16" }),
                    h("circle", { cx: 9, cy: 6, r: 2 }),
                    h("path", { d: "M4 12h16" }),
                    h("circle", { cx: 15, cy: 12, r: 2 }),
                    h("path", { d: "M4 18h16" }),
                    h("circle", { cx: 7, cy: 18, r: 2 }),
                ]);
            case "integrate":
                return h("svg", props, [
                    h("path", { d: "M10 13a3 3 0 0 0 4 0l3-3a3 3 0 0 0-4-4l-1 1" }),
                    h("path", { d: "M14 11a3 3 0 0 0-4 0l-3 3a3 3 0 0 0 4 4l1-1" }),
                ]);
            case "usage":
                return h("svg", props, [
                    h("rect", { x: 3, y: 5, width: 18, height: 14, rx: 2 }),
                    h("path", { d: "M3 10h18" }),
                    h("path", { d: "M7 15h5" }),
                ]);
            case "logout":
                return h("svg", props, [
                    h("path", { d: "M4 5h7a2 2 0 0 1 2 2v3" }),
                    h("path", { d: "M13 14v3a2 2 0 0 1-2 2H4" }),
                    h("path", { d: "M10 12h10" }),
                    h("polyline", { points: "16 8 20 12 16 16" }),
                ]);

            default:
                return h("svg", props);
        }
    };

    function Sidebar({ activePage }) {
        const navItems = [
            { href: "/dashboard", label: "Dashboard", id: "dashboard", icon: "dashboard" },
            { href: "/stats", label: "Statistiken", id: "stats", icon: "stats" },
            { href: "/scraping", label: "Scraping & Index", id: "scraping", icon: "scraping" },
            { href: "/chat", label: "Chat", id: "chat", icon: "chat" },
            { href: "/memory", label: "Memory bearbeiten", id: "memory", icon: "memory" },
            { href: "/faqs", label: "FAQs", id: "faqs", icon: "faqs" },
            { href: "/pdf-upload", label: "PDF Upload", id: "pdf-upload", icon: "pdf" },
            { href: "/widget-design", label: "Widget Design", id: "widget-design", icon: "widget" },
            { href: "/integrate", label: "Integrieren", id: "integrate", icon: "integrate" },
            { href: "/usage", label: "Kosten", id: "usage", icon: "usage" },
            { href: "/login/", label: "Logout", id: "logout", icon: "logout", onClick: () => AuthState.logout() },
        ];

        return h("aside", { className: "sidebar" }, [
            h("div", { key: "header", className: "sidebar-header" }, [
                h("div", { className: "sidebar-title" }, "florianmatthias"),
            ]),
            h("ul", { key: "nav", className: "nav-list" },
                navItems.map(item =>
                    h("li", { key: item.id },
                        h("a", {
                            href: item.href,
                            className: "nav-item" + (activePage === item.id ? " active" : ""),
                            onClick: item.onClick ? (event) => { event.preventDefault(); item.onClick(); } : undefined,
                        }, [
                            h("span", { key: "icon", className: "nav-icon" }, h(Icon, { name: item.icon })),
                            item.label
                        ])
                    )
                )
            ),
        ]);
    }

    function PdfUploadPage() {
        const [botSlug] = useState(AuthState.getBotSlug());
        const [pdfUploading, setPdfUploading] = useState(false);
        const [pdfError, setPdfError] = useState("");
        const [pdfMessage, setPdfMessage] = useState("");
        const [pdfFileNames, setPdfFileNames] = useState([]);
        const [dragOver, setDragOver] = useState(false);
        const [rebuildLoading, setRebuildLoading] = useState(false);
        const [rebuildInfo, setRebuildInfo] = useState("");
        const fileInputRef = useRef(null);

        const handlePdfChange = (e) => {
            const files = Array.from(e.target.files || []);
            setPdfMessage("");
            setPdfError("");
            setPdfFileNames(files.map((file) => file.name));
        };

        const handleDrop = (e) => {
            e.preventDefault();
            setDragOver(false);
            const dropped = Array.from(e.dataTransfer.files || []);
            const pdfFiles = dropped.filter((file) => {
                const name = (file.name || "").toLowerCase();
                return file.type === "application/pdf" || name.endsWith(".pdf");
            });

            if (pdfFiles.length > 0) {
                const dt = new DataTransfer();
                pdfFiles.forEach((file) => dt.items.add(file));
                fileInputRef.current.files = dt.files;
                setPdfFileNames(pdfFiles.map((file) => file.name));
                setPdfError("");
                setPdfMessage("");
            } else {
                setPdfError("Bitte nur PDF-Dateien hochladen.");
            }
        };

        const uploadPdf = async () => {
            const files = Array.from(fileInputRef.current?.files || []);
            if (!files.length) {
                setPdfError("Bitte mindestens eine PDF-Datei auswählen.");
                return;
            }
            if (!botSlug.trim()) {
                setPdfError("Bitte Bot-Slug auf Dashboard eintragen.");
                return;
            }
            setPdfUploading(true);
            setPdfError("");
            setPdfMessage("");
            try {
                const formData = new FormData();
                files.forEach((file) => formData.append("pdf", file));
                formData.append("bot_slug", botSlug.trim());
                const res = await fetch("/api/admin/upload_pdf", {
                    method: "POST",
                    body: formData,
                    headers: AuthState.buildHeaders(false),
                });
                const data = await res.json();
                if (!res.ok) {
                    setPdfError(data.error || "Upload fehlgeschlagen.");
                    return;
                }
                const prefix = data.status === "partial" ? "⚠️ " : "✅ ";
                setPdfMessage(prefix + (data.info || "PDF gespeichert. Bitte Index neu bauen."));
                setPdfFileNames([]);
                if (fileInputRef.current) fileInputRef.current.value = "";
            } catch (err) {
                console.error(err);
                setPdfError("Netzwerkfehler beim Upload.");
            } finally {
                setPdfUploading(false);
            }
        };

        const rebuildIndex = async () => {
            setPdfError("");
            setRebuildInfo("");
            if (!botSlug.trim()) {
                setPdfError("Bitte Bot-Slug auf Dashboard eintragen.");
                return;
            }
            setRebuildLoading(true);
            try {
                const res = await fetch("/api/admin/run", {
                    method: "POST",
                    headers: AuthState.buildHeaders(true),
                    body: JSON.stringify({ index_only: true, bot_slug: botSlug.trim() }),
                });
                const data = await res.json();
                if (!res.ok) {
                    setPdfError(data.error || "Index-Neubau fehlgeschlagen.");
                    return;
                }
                setRebuildInfo("Index-Job gestartet. Fortschritt unter \"Scraping & Index\" prüfen.");
            } catch (err) {
                console.error(err);
                setPdfError("Netzwerkfehler beim Index-Neubau.");
            } finally {
                setRebuildLoading(false);
            }
        };

        if (!AuthState.isLoggedIn()) {
            window.location.href = "/login";
            return null;
        }

        return h("div", { className: "layout" }, [
            h(Sidebar, { key: "sidebar", activePage: "pdf-upload" }),
            h("div", { key: "content", className: "content" }, [
                h("div", { key: "hero", className: "hero" }, [
                    h("div", { className: "hero-badge" }, [
                        h("span", { className: "hero-badge-dot" }),
                        "PDF Upload"
                    ]),
                    h("h1", { className: "title" }, "PDF hochladen"),
                    h("p", { className: "subtitle" }, "Lade PDF-Dokumente hoch, um deren Inhalt in deinen Suchindex aufzunehmen."),
                ]),

                pdfError ? h("div", {
                    key: "error", style: {
                        background: "var(--error-bg)", color: "var(--error)",
                        padding: "12px 16px", borderRadius: 12, marginBottom: 16
                    }
                }, pdfError) : null,
                pdfMessage ? h("div", {
                    key: "message", style: {
                        background: "var(--success-bg)", color: "var(--success)",
                        padding: "12px 16px", borderRadius: 12, marginBottom: 16
                    }
                }, pdfMessage) : null,
                rebuildInfo ? h("div", {
                    key: "rebuild", style: {
                        background: "var(--bg-tertiary)", color: "var(--text-primary)",
                        padding: "12px 16px", borderRadius: 12, marginBottom: 16,
                        border: "1px solid var(--border-subtle)"
                    }
                }, rebuildInfo) : null,

                h("div", { key: "upload", className: "card" }, [
                    h("h2", null, [h("span", { className: "card-icon" }, "📄"), "Dateien hochladen"]),
                    h("p", { className: "muted" }, "Ziehe eine oder mehrere PDF-Dateien hierher oder klicke zum Auswählen."),
                    h("div", {
                        onDragOver: (e) => { e.preventDefault(); setDragOver(true); },
                        onDragLeave: () => setDragOver(false),
                        onDrop: handleDrop,
                        onClick: () => fileInputRef.current.click(),
                        style: {
                            border: dragOver ? "2px dashed var(--accent-primary)" : "2px dashed var(--border-subtle)",
                            borderRadius: 16,
                            padding: 48,
                            textAlign: "center",
                            cursor: "pointer",
                            background: dragOver ? "rgba(139, 92, 246, 0.1)" : "var(--bg-secondary)",
                            transition: "all 0.2s ease",
                            marginBottom: 20
                        }
                    }, [
                        h("div", { style: { fontSize: 48, marginBottom: 16 } }, "📁"),
                        h("div", { style: { fontSize: 16, fontWeight: 600, marginBottom: 8 } },
                            pdfFileNames.length ? `${pdfFileNames.length} Datei(en) ausgewählt` : "PDF-Dateien hierher ziehen"),
                        h("div", { style: { fontSize: 13, color: "var(--text-muted)" } },
                            pdfFileNames.length ? "Klicke um die Auswahl zu ändern" : "oder klicke zum Auswählen"),
                    ]),
                    h("input", {
                        type: "file",
                        accept: "application/pdf",
                        multiple: true,
                        ref: fileInputRef,
                        onChange: handlePdfChange,
                        style: { display: "none" }
                    }),
                    pdfFileNames.length
                        ? h("div", { className: "muted", style: { marginBottom: 10 } }, pdfFileNames.slice(0, 6).join(", ") + (pdfFileNames.length > 6 ? ` (+${pdfFileNames.length - 6} weitere)` : ""))
                        : null,
                    h("div", { style: { display: "grid", gap: 10, marginTop: 12 } }, [
                        h("button", {
                            onClick: uploadPdf,
                            disabled: pdfUploading || !pdfFileNames.length,
                            style: { width: "100%" }
                        }, h("span", null, pdfUploading ? "⏳ Lädt hoch..." : "📤 PDF(s) hochladen")),
                        h("button", {
                            onClick: rebuildIndex,
                            disabled: rebuildLoading,
                            style: { width: "100%" }
                        }, h("span", null, rebuildLoading ? "⏳ Index läuft..." : "🔄 Index neu bauen")),
                    ]),
                    h("p", { className: "muted-note", style: { marginTop: 16, textAlign: "center" } },
                        "Nach dem Upload direkt \"Index neu bauen\" klicken."),
                ]),
            ]),
        ]);
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(PdfUploadPage));
</script>
{% endblock %}
