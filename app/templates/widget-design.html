    function sanitizeSvg(markup) {
        if (!markup || typeof markup !== "string") return null;
        const trimmed = markup.trim();
        if (!trimmed.toLowerCase().startsWith("<svg")) return null;
        try {
            const parser = new DOMParser();
            const doc = parser.parseFromString(trimmed, "image/svg+xml");
            if (doc.querySelector("parsererror")) return null;
            const svg = doc.documentElement;
            if (!svg || svg.nodeName.toLowerCase() !== "svg") return null;
            const blocked = ["script", "foreignObject", "iframe", "object", "embed", "link", "style"];
            blocked.forEach((tag) => {
                doc.querySelectorAll(tag).forEach((el) => el.remove());
            });
            doc.querySelectorAll("*").forEach((el) => {
                Array.from(el.attributes).forEach((attr) => {
                    const name = attr.name.toLowerCase();
                    const value = (attr.value || "").trim();
                    if (name.startsWith("on")) {
                        el.removeAttribute(attr.name);
                        return;
                    }
                    if (name === "href" || name === "xlink:href") {
                        if (value && !value.startsWith("#")) {
                            el.removeAttribute(attr.name);
                        }
                    }
                });
            });
            return svg;
        } catch (err) {
            return null;
        }
    }

    function parseViewBox(svgEl) {
        if (!svgEl) return null;
        const vb = svgEl.getAttribute("viewBox");
        if (!vb) return null;
        const parts = vb.trim().split(/[ ,]+/).map(Number);
        if (parts.length !== 4 || parts.some((n) => Number.isNaN(n))) return null;
        return { x: parts[0], y: parts[1], width: parts[2], height: parts[3] };
    }

    function normalizeSvg(svgEl) {
        if (!svgEl || !svgEl.getBBox) return;
        svgEl.removeAttribute("width");
        svgEl.removeAttribute("height");
        svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");
        try {
            const box = svgEl.getBBox();
            if (!box || !box.width || !box.height) return;
            const vb = parseViewBox(svgEl);
            if (vb) {
                const widthRatio = box.width / vb.width;
                const heightRatio = box.height / vb.height;
                const offsetRatio = Math.max(
                    Math.abs(box.x - vb.x) / vb.width,
                    Math.abs(box.y - vb.y) / vb.height
                );
                const needsFit = widthRatio < 0.7 || heightRatio < 0.7 || offsetRatio > 0.15;
                if (!needsFit) return;
            }
            const pad = Math.max(box.width, box.height) * 0.08;
            const x = box.x - pad;
            const y = box.y - pad;
            const w = box.width + pad * 2;
            const h = box.height + pad * 2;
            svgEl.setAttribute("viewBox", `${x} ${y} ${w} ${h}`);
        } catch (err) { }
    }

    function setToggleIcon(toggleEl, iconValue) {
        if (!toggleEl) return;
        const trimmed = (iconValue || "").trim();
        toggleEl.innerHTML = "";
        if (!trimmed) return;
        if (trimmed.toLowerCase().startsWith("<svg")) {
            const safeSvg = sanitizeSvg(trimmed);
            if (safeSvg) {
                toggleEl.appendChild(safeSvg);
                normalizeSvg(safeSvg);
                return;
            }
        }
        toggleEl.textContent = trimmed;
    }

    function Sidebar({ activePage }) {
        const navItems = [
            { href: "/dashboard", label: "Dashboard", id: "dashboard", icon: "dashboard" },
            { href: "/stats", label: "Statistiken", id: "stats", icon: "stats" },
            { href: "/scraping", label: "Scraping & Index", id: "scraping", icon: "scraping" },
            { href: "/chat", label: "Chat", id: "chat", icon: "chat" },
            { href: "/memory", label: "Memory bearbeiten", id: "memory", icon: "memory" },
            { href: "/faqs", label: "FAQs", id: "faqs", icon: "faqs" },
            { href: "/pdf-upload", label: "PDF Upload", id: "pdf-upload", icon: "pdf" },
            { href: "/widget-design", label: "Widget Design", id: "widget-design", icon: "widget" },
            { href: "/integrate", label: "Integrieren", id: "integrate", icon: "integrate" },
            { href: "/usage", label: "Kosten", id: "usage", icon: "usage" },
            { href: "/login/", label: "Logout", id: "logout", icon: "logout", onClick: () => AuthState.logout() },
        ];

        return h("aside", { className: "sidebar" }, [
            h("div", { key: "header", className: "sidebar-header" }, [
                h("div", { className: "sidebar-title" }, "florianmatthias"),
            ]),
            h("ul", { key: "nav", className: "nav-list" },
                navItems.map(item =>
                    h("li", { key: item.id },
                        h("a", {
                            href: item.href,
                            className: "nav-item" + (activePage === item.id ? " active" : ""),
                            onClick: item.onClick ? (event) => { event.preventDefault(); item.onClick(); } : undefined,
                        }, [
                            h("span", { key: "icon", className: "nav-icon" }, h(Icon, { name: item.icon })),
                            item.label
                        ])
                    )
                )
            ),
        ]);
    }

    function WidgetDesignPage() {
        const [botSlug] = useState(AuthState.getBotSlug());
        const [embedTitle, setEmbedTitle] = useState(DEFAULT_COPY.de.title);
        const [embedSubtitle, setEmbedSubtitle] = useState(DEFAULT_COPY.de.subtitle);
        const [embedIcon, setEmbedIcon] = useState(DEFAULT_ICON_SVG);
        const [embedIntro1, setEmbedIntro1] = useState(DEFAULT_COPY.de.intro1);
        const [embedTitleEn, setEmbedTitleEn] = useState(DEFAULT_COPY.en.title);
        const [embedSubtitleEn, setEmbedSubtitleEn] = useState(DEFAULT_COPY.en.subtitle);
        const [embedIntro1En, setEmbedIntro1En] = useState(DEFAULT_COPY.en.intro1);
        const [embedStatus, setEmbedStatus] = useState(DEFAULT_COPY.de.status);
        const [embedStatusEn, setEmbedStatusEn] = useState(DEFAULT_COPY.en.status);
        const [showStatus, setShowStatus] = useState(true);
        const [embedDisclaimer, setEmbedDisclaimer] = useState(DEFAULT_COPY.de.disclaimer);
        const [embedDisclaimerEn, setEmbedDisclaimerEn] = useState(DEFAULT_COPY.en.disclaimer);
        const [privacyUrl, setPrivacyUrl] = useState("");
        const [privacyLabel, setPrivacyLabel] = useState(DEFAULT_COPY.de.privacyLabel);
        const [privacyLabelEn, setPrivacyLabelEn] = useState(DEFAULT_COPY.en.privacyLabel);
        const [showPoweredBy, setShowPoweredBy] = useState(true);
        const [theme, setTheme] = useState(() => ({ ...DEFAULT_THEME }));
        const [prompt, setPrompt] = useState("");
        const [promptStatus, setPromptStatus] = useState("");
        const [widgetCfg, setWidgetCfg] = useState(() => JSON.parse(JSON.stringify(EMPTY_WIDGET_CFG)));
        const [widgetCfgStatus, setWidgetCfgStatus] = useState("");
        const [widgetDefaults, setWidgetDefaults] = useState({ greeting_text: {}, topics_label: {} });

        useEffect(() => {
            const saved = AuthState.getScopedItem("widget_theme_cfg", botSlug) || "";
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.title) setEmbedTitle(parsed.title);
                    if (parsed.subtitle) setEmbedSubtitle(parsed.subtitle);
                    if (parsed.icon) setEmbedIcon(parsed.icon);
                    if (parsed.intro1 !== undefined) setEmbedIntro1(parsed.intro1);
                    if (parsed.titleEn || parsed.title_en) setEmbedTitleEn(parsed.titleEn || parsed.title_en);
                    if (parsed.subtitleEn || parsed.subtitle_en) setEmbedSubtitleEn(parsed.subtitleEn || parsed.subtitle_en);
                    if (parsed.intro1En || parsed.intro1_en) setEmbedIntro1En(parsed.intro1En || parsed.intro1_en);
                    // Migration: ein frueher gesetzter Untertitel wird zur Statuszeile.
                    if (parsed.status !== undefined) setEmbedStatus(parsed.status);
                    else if (parsed.subtitle) setEmbedStatus(parsed.subtitle);
                    if (parsed.statusEn !== undefined) setEmbedStatusEn(parsed.statusEn);
                    else if (parsed.subtitleEn || parsed.subtitle_en) setEmbedStatusEn(parsed.subtitleEn || parsed.subtitle_en);
                    if (typeof parsed.showStatus === "boolean") setShowStatus(parsed.showStatus);
                    if (parsed.disclaimer !== undefined) setEmbedDisclaimer(parsed.disclaimer);
                    if (parsed.disclaimerEn !== undefined) setEmbedDisclaimerEn(parsed.disclaimerEn);
                    if (parsed.privacyUrl !== undefined) setPrivacyUrl(parsed.privacyUrl);
                    if (parsed.privacyLabel !== undefined) setPrivacyLabel(parsed.privacyLabel);
                    if (parsed.privacyLabelEn !== undefined) setPrivacyLabelEn(parsed.privacyLabelEn);
                    if (typeof parsed.showPoweredBy === "boolean") setShowPoweredBy(parsed.showPoweredBy);
                    if (parsed.theme && typeof parsed.theme === "object") {
                        const { border, ...restTheme } = parsed.theme;
                        setTheme({ ...DEFAULT_THEME, ...restTheme });
                    }
                } catch (err) { }
            }
        }, [botSlug]);

        useEffect(() => {
            const loadPrompt = async () => {
                if (!AuthState.isLoggedIn() || !botSlug) return;
                try {
                    const params = new URLSearchParams();
                    params.set("bot_slug", botSlug);
                    const res = await fetch(`/api/admin/prompt?${params.toString()}`, {
                        headers: AuthState.buildHeaders(),
                    });
                    const data = await res.json();
                    if (res.ok && data.prompt !== undefined) {
                        setPrompt(data.prompt);
                        setPromptStatus("");
                    } else {
                        setPromptStatus(data.error || "Prompt konnte nicht geladen werden.");
                    }
                } catch (err) {
                    console.error("Prompt laden fehlgeschlagen", err);
                    setPromptStatus("Prompt konnte nicht geladen werden.");
                }
            };
            loadPrompt();
        }, [botSlug]);

        useEffect(() => {
            const loadWidgetCfg = async () => {
                if (!AuthState.isLoggedIn() || !botSlug) return;
                try {
                    const params = new URLSearchParams();
                    params.set("bot_slug", botSlug);
                    const res = await fetch(`/api/admin/widget_config?${params.toString()}`, {
                        headers: AuthState.buildHeaders(),
                    });
                    const data = await res.json();
                    if (res.ok && data.config) {
                        setWidgetCfg({ ...JSON.parse(JSON.stringify(EMPTY_WIDGET_CFG)), ...data.config });
                        if (data.defaults) setWidgetDefaults(data.defaults);
                        setWidgetCfgStatus("");
                    } else {
                        setWidgetCfgStatus(data.error || "Inhalte konnten nicht geladen werden.");
                    }
                } catch (err) {
                    console.error("Widget-Inhalte laden fehlgeschlagen", err);
                    setWidgetCfgStatus("Inhalte konnten nicht geladen werden.");
                }
            };
            loadWidgetCfg();
        }, [botSlug]);

        const updateGreeting = (key, value) => setWidgetCfg((prev) => ({
            ...prev,
            greeting: { ...prev.greeting, [key]: value },
        }));
        const updateGreetingText = (lang, value) => setWidgetCfg((prev) => ({
            ...prev,
            greeting: { ...prev.greeting, text: { ...prev.greeting.text, [lang]: value } },
        }));
        const updateTopicsLabel = (lang, value) => setWidgetCfg((prev) => ({
            ...prev,
            topics_label: { ...prev.topics_label, [lang]: value },
        }));
        const updateTopic = (idx, path, value) => setWidgetCfg((prev) => {
            const topics = prev.topics.map((topic, i) => {
                if (i !== idx) return topic;
                if (path === "url" || path === "highlight") return { ...topic, [path]: value };
                const [field, lang] = path.split(".");
                return { ...topic, [field]: { ...topic[field], [lang]: value } };
            });
            return { ...prev, topics };
        });
        const updateContact = (key, value) => setWidgetCfg((prev) => ({
            ...prev,
            contact: { ...(prev.contact || {}), [key]: value },
        }));
        const updateActionLabel = (lang, key, value) => setWidgetCfg((prev) => ({
            ...prev,
            action_labels: {
                ...(prev.action_labels || {}),
                [lang]: { ...((prev.action_labels || {})[lang] || {}), [key]: value },
            },
        }));
        const addTopic = () => setWidgetCfg((prev) => ({ ...prev, topics: [...prev.topics, EMPTY_TOPIC()] }));
        const removeTopic = (idx) => setWidgetCfg((prev) => ({
            ...prev,
            topics: prev.topics.filter((_, i) => i !== idx),
        }));
        const moveTopic = (idx, offset) => setWidgetCfg((prev) => {
            const next = [...prev.topics];
            const target = idx + offset;
            if (target < 0 || target >= next.length) return prev;
            const [item] = next.splice(idx, 1);
            next.splice(target, 0, item);
            return { ...prev, topics: next };
        });

        const saveWidgetCfg = async () => {
            setWidgetCfgStatus("Speichere...");
            try {
                const res = await fetch("/api/admin/widget_config", {
                    method: "POST",
                    headers: AuthState.buildHeaders(true),
                    body: JSON.stringify({ bot_slug: botSlug, config: widgetCfg }),
                });
                const data = await res.json();
                if (!res.ok) {
                    setWidgetCfgStatus(data.error || "Konnte Inhalte nicht speichern.");
                    return;
                }
                if (data.config) setWidgetCfg({ ...JSON.parse(JSON.stringify(EMPTY_WIDGET_CFG)), ...data.config });
                setWidgetCfgStatus("Gespeichert.");
                // Vorschau neu laden, damit die Startansicht die neuen Themen zeigt.
                const iframe = document.getElementById("chat-embed-frame");
                if (iframe) iframe.src = iframe.src;
            } catch (err) {
                console.error(err);
                setWidgetCfgStatus("Netzwerkfehler beim Speichern.");
            }
        };

        const embedSrc = useMemo(() => {
            const params = new URLSearchParams();
            if (botSlug.trim()) params.set("bot_slug", botSlug.trim());
            if (AuthState.getToken()) params.set("token", AuthState.getToken());
            const trimmedTitle = embedTitle.trim();
            const trimmedSubtitle = embedSubtitle.trim();
            const trimmedIntro1 = embedIntro1.trim();
            const trimmedTitleEn = embedTitleEn.trim();
            const trimmedSubtitleEn = embedSubtitleEn.trim();
            const trimmedIntro1En = embedIntro1En.trim();
            if (trimmedTitle && trimmedTitle !== DEFAULT_COPY.de.title) {
                params.set("title_de", trimmedTitle);
            }
            if (trimmedSubtitle) params.set("subtitle_de", trimmedSubtitle);
            // Immer setzen: ein leeres Feld bedeutet "kein Avatar".
            params.set("icon", embedIcon.trim());
            if (trimmedIntro1 && trimmedIntro1 !== DEFAULT_COPY.de.intro1) {
                params.set("intro1_de", trimmedIntro1);
            }
            if (trimmedTitleEn && trimmedTitleEn !== DEFAULT_COPY.en.title) {
                params.set("title_en", trimmedTitleEn);
            }
            if (trimmedSubtitleEn) params.set("subtitle_en", trimmedSubtitleEn);
            if (trimmedIntro1En && trimmedIntro1En !== DEFAULT_COPY.en.intro1) {
                params.set("intro1_en", trimmedIntro1En);
            }
            // Statuszeile, Hinweistext und Datenschutz-Link der neuen Fusszeile.
            // Status wird immer gesetzt, damit ein alter Untertitel ihn nicht ueberschreibt.
            if (embedStatus.trim()) params.set("status_de", embedStatus.trim());
            if (embedStatusEn.trim()) params.set("status_en", embedStatusEn.trim());
            if (!showStatus) params.set("show_status", "0");
            if (embedDisclaimer.trim() && embedDisclaimer.trim() !== DEFAULT_COPY.de.disclaimer) {
                params.set("disclaimer_de", embedDisclaimer.trim());
            }
            if (embedDisclaimerEn.trim() && embedDisclaimerEn.trim() !== DEFAULT_COPY.en.disclaimer) {
                params.set("disclaimer_en", embedDisclaimerEn.trim());
            }
            if (privacyUrl.trim()) {
                params.set("privacy_url", privacyUrl.trim());
                if (privacyLabel.trim() && privacyLabel.trim() !== DEFAULT_COPY.de.privacyLabel) {
                    params.set("privacy_label_de", privacyLabel.trim());
                }
                if (privacyLabelEn.trim() && privacyLabelEn.trim() !== DEFAULT_COPY.en.privacyLabel) {
                    params.set("privacy_label_en", privacyLabelEn.trim());
                }
            }
            if (!showPoweredBy) params.set("show_powered_by", "0");
            Object.entries(theme).forEach(([key, value]) => {
                if (key === "border") return;
                if (value) params.set(`theme_${key}`, value);
            });
            return "/embed" + (params.toString() ? "?" + params.toString() : "");
        }, [botSlug, embedTitle, embedSubtitle, embedIcon, embedIntro1, embedTitleEn, embedSubtitleEn, embedIntro1En,
            embedStatus, embedStatusEn, showStatus, embedDisclaimer, embedDisclaimerEn,
            privacyUrl, privacyLabel, privacyLabelEn, showPoweredBy, theme]);

        useEffect(() => {
            AuthState.setScopedItem("widget_theme_cfg", JSON.stringify({
                title: embedTitle,
                subtitle: embedSubtitle,
                icon: embedIcon,
                intro1: embedIntro1,
                titleEn: embedTitleEn,
                subtitleEn: embedSubtitleEn,
                intro1En: embedIntro1En,
                status: embedStatus,
                statusEn: embedStatusEn,
                showStatus,
                disclaimer: embedDisclaimer,
                disclaimerEn: embedDisclaimerEn,
                privacyUrl,
                privacyLabel,
                privacyLabelEn,
                showPoweredBy,
                theme
            }), botSlug);
            const iframe = document.getElementById("chat-embed-frame");
            if (iframe) iframe.src = embedSrc;
            const toggle = document.getElementById("chat-toggle");
            if (toggle) {
                setToggleIcon(toggle, embedIcon);
                const accent = theme.accent;
                const accentStrong = theme.accentStrong;
                const launcherBg =
                    theme.launcherBg ||
                    (accent && accentStrong ? `linear-gradient(135deg, ${accent}, ${accentStrong})` : accent);
                if (launcherBg) toggle.style.background = launcherBg;
            }
        }, [botSlug, embedSrc, embedIcon, embedIntro1, embedTitleEn, embedSubtitleEn, embedIntro1En,
            embedStatus, embedStatusEn, showStatus, embedDisclaimer, embedDisclaimerEn,
            privacyUrl, privacyLabel, privacyLabelEn, showPoweredBy, theme]);

        const updateTheme = (key, value) => setTheme((prev) => ({ ...prev, [key]: value }));
        const resetTheme = () => {
            setTheme({ ...DEFAULT_THEME });
            setEmbedTitle(DEFAULT_COPY.de.title);
            setEmbedSubtitle(DEFAULT_COPY.de.subtitle);
            setEmbedIcon(DEFAULT_ICON_SVG);
            setEmbedIntro1(DEFAULT_COPY.de.intro1);
            setEmbedTitleEn(DEFAULT_COPY.en.title);
            setEmbedSubtitleEn(DEFAULT_COPY.en.subtitle);
            setEmbedIntro1En(DEFAULT_COPY.en.intro1);
            setEmbedStatus(DEFAULT_COPY.de.status);
            setEmbedStatusEn(DEFAULT_COPY.en.status);
            setShowStatus(true);
            setEmbedDisclaimer(DEFAULT_COPY.de.disclaimer);
            setEmbedDisclaimerEn(DEFAULT_COPY.en.disclaimer);
            setPrivacyUrl("");
            setPrivacyLabel(DEFAULT_COPY.de.privacyLabel);
            setPrivacyLabelEn(DEFAULT_COPY.en.privacyLabel);
            setShowPoweredBy(true);
        };

        const savePrompt = async () => {
            if (!prompt.trim()) {
                setPromptStatus("Prompt darf nicht leer sein.");
                return;
            }
            setPromptStatus("Speichere...");
            try {
                const res = await fetch("/api/admin/prompt", {
                    method: "POST",
                    headers: AuthState.buildHeaders(true),
                    body: JSON.stringify({ bot_slug: botSlug, prompt }),
                });
                const data = await res.json();
                if (!res.ok) {
                    setPromptStatus(data.error || "Konnte Prompt nicht speichern.");
                    return;
                }
                setPromptStatus("Gespeichert.");
            } catch (err) {
                console.error(err);
                setPromptStatus("Netzwerkfehler beim Speichern.");
            }
        };

        if (!AuthState.isLoggedIn()) {
            window.location.href = "/login";
            return null;
        }

        return h("div", { className: "layout" }, [
            h(Sidebar, { key: "sidebar", activePage: "widget-design" }),
            h("div", { key: "content", className: "content" }, [
                h("div", { key: "hero", className: "hero" }, [
                    h("div", { className: "hero-badge" }, [
                        h("span", { className: "hero-badge-dot" }),
                        "Widget Customization"
                    ]),
                    h("h1", { className: "title" }, "Widget Design"),
                    h("p", { className: "subtitle" }, "Passe das Aussehen deines Chat-Widgets an."),
                ]),

                h("div", { key: "design", className: "card" }, [
                    h("h2", null, [h("span", { className: "card-icon" }, "✏️"), "Grundeinstellungen"]),
                    h("p", { className: "muted" }, "Titel, Untertitel und Icon für das Widget."),
                    h("div", { className: "stack" }, [
                        h("div", { style: { fontWeight: 600, marginBottom: 4 } }, "Deutsch"),
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: "Widget Titel (DE)",
                                value: embedTitle,
                                onChange: (e) => setEmbedTitle(e.target.value),
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: "Statuszeile (DE), z.B. Antwortet sofort",
                                value: embedStatus,
                                onChange: (e) => setEmbedStatus(e.target.value),
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("textarea", {
                                placeholder: "Intro Text 1 (DE)",
                                value: embedIntro1,
                                onChange: (e) => setEmbedIntro1(e.target.value),
                                style: { minHeight: 90 }
                            }),
                        ]),
                        h("div", { style: { fontWeight: 600, marginTop: 8, marginBottom: 4 } }, "English"),
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: "Widget Title (EN)",
                                value: embedTitleEn,
                                onChange: (e) => setEmbedTitleEn(e.target.value),
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: "Status line (EN), e.g. Replies instantly",
                                value: embedStatusEn,
                                onChange: (e) => setEmbedStatusEn(e.target.value),
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("textarea", {
                                placeholder: "Intro Text 1 (EN)",
                                value: embedIntro1En,
                                onChange: (e) => setEmbedIntro1En(e.target.value),
                                style: { minHeight: 90 }
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("textarea", {
                                placeholder: "Icon / Emoji oder SVG (z.B. <svg ...></svg>) - leer = kein Avatar",
                                value: embedIcon,
                                onChange: (e) => setEmbedIcon(e.target.value),
                                style: { minHeight: 90 }
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("label", { style: { display: "flex", alignItems: "center", gap: 10 } }, [
                                h("input", {
                                    type: "checkbox",
                                    checked: showStatus,
                                    onChange: (e) => setShowStatus(e.target.checked),
                                }),
                                h("span", null, "Statuszeile mit Punkt anzeigen"),
                            ]),
                        ]),
                        h("div", { className: "control" }, [
                            h("label", { style: { display: "flex", alignItems: "center", gap: 10 } }, [
                                h("input", {
                                    type: "checkbox",
                                    checked: showPoweredBy,
                                    onChange: (e) => setShowPoweredBy(e.target.checked),
                                }),
                                h("span", null, "Powered by florianmatthias anzeigen"),
                            ]),
                        ]),
                    ]),
                ]),

                h("div", { key: "footer", className: "card" }, [
                    h("h2", null, [h("span", { className: "card-icon" }, "📄"), "Fusszeile"]),
                    h("p", { className: "muted" },
                        "Hinweistext unter dem Eingabefeld und optionaler Datenschutz-Link. " +
                        "Leer lassen für die Standardtexte."),
                    h("div", { className: "stack" }, [
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: DEFAULT_COPY.de.disclaimer,
                                value: embedDisclaimer,
                                onChange: (e) => setEmbedDisclaimer(e.target.value),
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: DEFAULT_COPY.en.disclaimer,
                                value: embedDisclaimerEn,
                                onChange: (e) => setEmbedDisclaimerEn(e.target.value),
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: "Datenschutz-URL (leer = kein Link)",
                                value: privacyUrl,
                                onChange: (e) => setPrivacyUrl(e.target.value),
                            }),
                        ]),
                        h("div", { className: "form-grid" }, [
                            h("input", {
                                key: "pl-de",
                                placeholder: "Link-Text (DE)",
                                value: privacyLabel,
                                onChange: (e) => setPrivacyLabel(e.target.value),
                            }),
                            h("input", {
                                key: "pl-en",
                                placeholder: "Link text (EN)",
                                value: privacyLabelEn,
                                onChange: (e) => setPrivacyLabelEn(e.target.value),
                            }),
                        ]),
                    ]),
                ]),

                h("div", { key: "colors", className: "card" }, [
                    h("h2", null, [h("span", { className: "card-icon" }, "🎨"), "Farbschema"]),
                    h("p", { className: "muted" }, "Passe die Farben des Widgets an."),
                    h("div", { className: "theme-grid" },
                        THEME_FIELDS.map((field) =>
                            h("label", { key: field.key, className: "theme-field" }, [
                                h("span", null, field.label),
                                h("input", {
                                    type: "color",
                                    value: theme[field.key] || DEFAULT_THEME[field.key],
                                    onChange: (e) => updateTheme(field.key, e.target.value),
                                }),
                            ])
                        )
                    ),
                    h("div", { style: { display: "flex", gap: 12, marginTop: 20 } }, [
                        h("button", { className: "ghost-btn", onClick: resetTheme }, "🔄 Zurücksetzen"),
                    ]),
                ]),

                h("div", { key: "prompt", className: "card" }, [
                    h("h2", null, [h("span", { className: "card-icon" }, "🧾"), "System-Prompt"]),
                    h("p", { className: "muted" }, "Dieser Prompt steuert den Ton und die Regeln des Chatbots."),
                    h("div", { className: "control", style: { flexDirection: "column", alignItems: "stretch" } }, [
                        h("textarea", {
                            value: prompt,
                            onChange: (e) => setPrompt(e.target.value),
                            style: { minHeight: 180 },
                            placeholder: "System-Prompt bearbeiten..."
                        }),
                        h("div", { className: "control", style: { justifyContent: "flex-start" } }, [
                            h("button", { onClick: savePrompt, style: { minWidth: 140 } }, "💾 Prompt speichern"),
                            promptStatus ? h("span", { className: "muted" }, promptStatus) : null,
                        ]),
                    ]),
                ]),

                h("div", { key: "greeting", className: "card" }, [
                    h("h2", null, [h("span", { className: "card-icon" }, "👋"), "Begrüßungs-Popup"]),
                    h("p", { className: "muted" },
                        "Erscheint neben dem Chat-Button, einmal pro Besucher. Über das × schließt der Besucher es weg."),
                    h("div", { className: "stack" }, [
                        h("div", { className: "control" }, [
                            h("label", { style: { display: "flex", alignItems: "center", gap: 10 } }, [
                                h("input", {
                                    type: "checkbox",
                                    checked: widgetCfg.greeting.enabled !== false,
                                    onChange: (e) => updateGreeting("enabled", e.target.checked),
                                }),
                                h("span", null, "Popup anzeigen"),
                            ]),
                        ]),
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: (widgetDefaults.greeting_text && widgetDefaults.greeting_text.de) || "Popup-Text (DE)",
                                value: widgetCfg.greeting.text.de || "",
                                onChange: (e) => updateGreetingText("de", e.target.value),
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: (widgetDefaults.greeting_text && widgetDefaults.greeting_text.en) || "Popup text (EN)",
                                value: widgetCfg.greeting.text.en || "",
                                onChange: (e) => updateGreetingText("en", e.target.value),
                            }),
                        ]),
                        h("div", { className: "control" }, [
                            h("span", { className: "muted" }, "Verzögerung nach Seitenaufruf"),
                            h("input", {
                                type: "number",
                                min: 0,
                                max: 20000,
                                step: 100,
                                style: { maxWidth: 140 },
                                value: typeof widgetCfg.greeting.delay_ms === "number" ? widgetCfg.greeting.delay_ms : 1200,
                                onChange: (e) => updateGreeting("delay_ms", Number(e.target.value) || 0),
                            }),
                            h("span", { className: "muted" }, "ms"),
                        ]),
                    ]),
                ]),

                h("div", { key: "topics", className: "card" }, [
                    h("h2", null, [h("span", { className: "card-icon" }, "⚡"), "Schnellaktionen der Startansicht"]),
                    h("p", { className: "muted" },
                        "Diese Themen erscheinen direkt beim Öffnen des Chats. Der Titel wird angezeigt, " +
                        "die Frage wird beim Klick an den Bot geschickt. Mit einer URL wird stattdessen die Seite geöffnet."),
                    h("div", { className: "stack" }, [
                        h("div", { className: "control" }, [
                            h("input", {
                                placeholder: (widgetDefaults.topics_label && widgetDefaults.topics_label.de) || "Überschrift (DE)",
                                value: widgetCfg.topics_label.de || "",
                                onChange: (e) => updateTopicsLabel("de", e.target.value),
                            }),
                            h("input", {
                                placeholder: (widgetDefaults.topics_label && widgetDefaults.topics_label.en) || "Heading (EN)",
                                value: widgetCfg.topics_label.en || "",
                                onChange: (e) => updateTopicsLabel("en", e.target.value),
                            }),
                        ]),

                        ...widgetCfg.topics.map((topic, idx) => h("div", {
                            key: `topic-${idx}`,
                            style: {
                                border: "1px solid var(--border-subtle)",
                                borderRadius: 12,
                                padding: 16,
                                display: "grid",
                                gap: 10,
                            },
                        }, [
                            h("div", { key: "head", style: { display: "flex", alignItems: "center", gap: 8 } }, [
                                h("strong", { style: { flex: 1 } }, `${idx + 1}. ${(topic.label && topic.label.de) || "Neues Thema"}`),
                                h("button", {
                                    className: "ghost-btn",
                                    title: "Nach oben",
                                    onClick: () => moveTopic(idx, -1),
                                }, "↑"),
                                h("button", {
                                    className: "ghost-btn",
                                    title: "Nach unten",
                                    onClick: () => moveTopic(idx, 1),
                                }, "↓"),
                                h("button", {
                                    className: "ghost-btn",
                                    title: "Entfernen",
                                    onClick: () => removeTopic(idx),
                                }, "🗑"),
                            ]),
                            h("div", { key: "labels", className: "form-grid" }, [
                                h("input", {
                                    placeholder: "Titel DE (z.B. Zimmer & Chalets)",
                                    value: (topic.label && topic.label.de) || "",
                                    onChange: (e) => updateTopic(idx, "label.de", e.target.value),
                                }),
                                h("input", {
                                    placeholder: "Titel EN",
                                    value: (topic.label && topic.label.en) || "",
                                    onChange: (e) => updateTopic(idx, "label.en", e.target.value),
                                }),
                            ]),
                            h("div", { key: "questions", className: "form-grid" }, [
                                h("input", {
                                    placeholder: "Frage DE, die gesendet wird",
                                    value: (topic.question && topic.question.de) || "",
                                    onChange: (e) => updateTopic(idx, "question.de", e.target.value),
                                }),
                                h("input", {
                                    placeholder: "Frage EN",
                                    value: (topic.question && topic.question.en) || "",
                                    onChange: (e) => updateTopic(idx, "question.en", e.target.value),
                                }),
                            ]),
                            h("div", { key: "extras", style: { display: "flex", gap: 12, alignItems: "center", flexWrap: "wrap" } }, [
                                h("input", {
                                    style: { flex: 1, minWidth: 220 },
                                    placeholder: "Optional: URL statt Frage (z.B. Kontaktformular)",
                                    value: topic.url || "",
                                    onChange: (e) => updateTopic(idx, "url", e.target.value),
                                }),
                                h("label", { style: { display: "flex", alignItems: "center", gap: 8 } }, [
                                    h("input", {
                                        type: "checkbox",
                                        checked: !!topic.highlight,
                                        onChange: (e) => updateTopic(idx, "highlight", e.target.checked),
                                    }),
                                    h("span", { className: "muted" }, "hervorheben"),
                                ]),
                            ]),
                        ])),

                        h("div", { className: "control", style: { justifyContent: "flex-start" } }, [
                            h("button", { className: "ghost-btn", onClick: addTopic }, "➕ Thema hinzufügen"),
                        ]),

                        h("div", { style: { fontWeight: 600, marginTop: 12, marginBottom: 4 } }, "Kontaktweg"),
                        h("p", { className: "muted", style: { marginTop: 0 } },
                            "Ziel des \"Kontakt aufnehmen\"-Buttons unter den Antworten. " +
                            "Ohne Angabe fragt der Bot im Chat nach."),
                        h("div", { className: "form-grid" }, [
                            h("input", {
                                key: "curl",
                                placeholder: "Kontaktseite oder Formular (URL)",
                                value: (widgetCfg.contact && widgetCfg.contact.url) || "",
                                onChange: (e) => updateContact("url", e.target.value),
                            }),
                            h("input", {
                                key: "cmail",
                                placeholder: "E-Mail (Fallback)",
                                value: (widgetCfg.contact && widgetCfg.contact.email) || "",
                                onChange: (e) => updateContact("email", e.target.value),
                            }),
                            h("input", {
                                key: "cphone",
                                placeholder: "Telefon (Fallback)",
                                value: (widgetCfg.contact && widgetCfg.contact.phone) || "",
                                onChange: (e) => updateContact("phone", e.target.value),
                            }),
                        ]),

                        h("div", { style: { fontWeight: 600, marginTop: 12, marginBottom: 4 } }, "Button-Texte in Antworten (Fallback)"),
                        h("p", { className: "muted", style: { marginTop: 0 } },
                            "Die Buttons unter den Antworten werden normalerweise von der KI aus dem " +
                            "Gesprächsverlauf erzeugt. Diese Texte greifen nur, wenn das fehlschlägt. " +
                            "Leer lassen für die Standardtexte."),
                        ...ACTION_LABEL_FIELDS.map((field) => h("div", {
                            key: `al-${field.key}`,
                            className: "form-grid",
                            style: { alignItems: "center" },
                        }, [
                            h("div", { key: "meta" }, [
                                h("div", { style: { fontSize: 13, fontWeight: 600 } }, field.label),
                                h("div", { className: "muted", style: { fontSize: 12 } }, field.hint),
                            ]),
                            h("input", {
                                key: "de",
                                placeholder: `${field.label} (DE)`,
                                value: ((widgetCfg.action_labels || {}).de || {})[field.key] || "",
                                onChange: (e) => updateActionLabel("de", field.key, e.target.value),
                            }),
                            h("input", {
                                key: "en",
                                placeholder: "(EN)",
                                value: ((widgetCfg.action_labels || {}).en || {})[field.key] || "",
                                onChange: (e) => updateActionLabel("en", field.key, e.target.value),
                            }),
                        ])),

                        h("div", { className: "control", style: { justifyContent: "flex-start", marginTop: 8 } }, [
                            h("button", { onClick: saveWidgetCfg, style: { minWidth: 160 } }, "💾 Speichern"),
                            widgetCfgStatus ? h("span", { className: "muted" }, widgetCfgStatus) : null,
                        ]),
                    ]),
                ]),

                h("div", { key: "embed", className: "card" }, [
                    h("h2", null, [h("span", { className: "card-icon" }, "📋"), "Embed URL"]),
                    h("p", { className: "muted" }, "Kopiere diese URL, um das Widget einzubetten."),
                    h("input", {
                        className: "embed-url",
                        readOnly: true,
                        value: embedSrc,
                        onFocus: (e) => e.target.select(),
                        onClick: (e) => e.target.select(),
                    }),
                    h("div", { className: "pill", style: { marginTop: 12 } }, "💡 Das Widget unten rechts zeigt deine Änderungen live."),
                ]),
            ]),
        ]);
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(WidgetDesignPage));
</script>
{% endblock %}
