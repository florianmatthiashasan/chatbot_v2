{% extends "base.html" %}
{% block title %}Chat - florianmatthias{% endblock %}

{% block content %}
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
    const { useEffect, useState, useRef } = React;
    const h = React.createElement;
    const CHAT_HISTORY_LIMIT = 16;

    const Icon = ({ name }) => {
        const props = { viewBox: "0 0 24 24", "aria-hidden": "true" };
        switch (name) {
            case "dashboard":
                return h("svg", props, [
                    h("rect", { x: 3, y: 3, width: 8, height: 8, rx: 2 }),
                    h("rect", { x: 13, y: 3, width: 8, height: 5, rx: 2 }),
                    h("rect", { x: 13, y: 10, width: 8, height: 11, rx: 2 }),
                    h("rect", { x: 3, y: 13, width: 8, height: 8, rx: 2 }),
                ]);
            case "stats":
                return h("svg", props, [
                    h("path", { d: "M3 19h18" }),
                    h("path", { d: "M6 16v-5" }),
                    h("path", { d: "M12 16v-8" }),
                    h("path", { d: "M18 16v-3" }),
                ]);
            case "scraping":
                return h("svg", props, [
                    h("path", { d: "M21 12a9 9 0 1 1-3-6.7" }),
                    h("polyline", { points: "21 3 21 9 15 9" }),
                ]);
            case "chat":
                return h("svg", props, [
                    h("path", { d: "M6 6h12a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H10l-4 3v-3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z" }),
                ]);
            case "memory":
                return h("svg", props, [
                    h("ellipse", { cx: 12, cy: 6, rx: 7, ry: 3 }),
                    h("path", { d: "M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6" }),
                    h("path", { d: "M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" }),
                ]);
            case "faqs":
                return h("svg", props, [
                    h("circle", { cx: 12, cy: 12, r: 9 }),
                    h("path", { d: "M9.5 9a2.5 2.5 0 0 1 5 0c0 1.6-2.5 1.9-2.5 4" }),
                    h("path", { d: "M12 17h.01" }),
                ]);
            case "pdf":
                return h("svg", props, [
                    h("path", { d: "M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" }),
                    h("path", { d: "M14 3v5h5" }),
                    h("path", { d: "M9 13h6" }),
                    h("path", { d: "M9 17h6" }),
                ]);
            case "widget":
                return h("svg", props, [
                    h("path", { d: "M4 6h16" }),
                    h("circle", { cx: 9, cy: 6, r: 2 }),
                    h("path", { d: "M4 12h16" }),
                    h("circle", { cx: 15, cy: 12, r: 2 }),
                    h("path", { d: "M4 18h16" }),
                    h("circle", { cx: 7, cy: 18, r: 2 }),
                ]);
            case "integrate":
                return h("svg", props, [
                    h("path", { d: "M10 13a3 3 0 0 0 4 0l3-3a3 3 0 0 0-4-4l-1 1" }),
                    h("path", { d: "M14 11a3 3 0 0 0-4 0l-3 3a3 3 0 0 0 4 4l1-1" }),
                ]);
            case "usage":
                return h("svg", props, [
                    h("rect", { x: 3, y: 5, width: 18, height: 14, rx: 2 }),
                    h("path", { d: "M3 10h18" }),
                    h("path", { d: "M7 15h5" }),
                ]);
            case "logout":
                return h("svg", props, [
                    h("path", { d: "M4 5h7a2 2 0 0 1 2 2v3" }),
                    h("path", { d: "M13 14v3a2 2 0 0 1-2 2H4" }),
                    h("path", { d: "M10 12h10" }),
                    h("polyline", { points: "16 8 20 12 16 16" }),
                ]);

            default:
                return h("svg", props);
        }
    };

    const SOURCES_HEADING_PATTERN = /^\s*(Quellen|Quelle|Sources|Source)\s*:\s*(.*)$/i;

    function renderPlainText(text, keyPrefix) {
        const parts = (text || "").split(/(mailto:[^\s]+|https?:\/\/[^\s]+|\/[^\s]+|[\w.+-]+@[\w.-]+\.[A-Za-z]{2,})/g);
        return parts.map((part, idx) => {
            if (/^(mailto:[^\s]+|https?:\/\/[^\s]+|\/[^\s]+|[\w.+-]+@[\w.-]+\.[A-Za-z]{2,})$/.test(part || "")) {
                let href = part;
                if (part.startsWith("/")) {
                    href = window.location.origin + part;
                } else if (!part.startsWith("http") && !part.startsWith("mailto:") && part.includes("@")) {
                    href = "mailto:" + part;
                }
                return h("a", { key: `${keyPrefix}-a-${idx}`, href, target: "_blank", rel: "noreferrer" }, part);
            }
            return part;
        });
    }

    // Rendert **fett**, __fett__, *kursiv*, `code` und Markdown-Links als echte Elemente.
    function renderInlineMarkdown(text, keyPrefix, depth) {
        const source = (text || "").toString();
        const level = depth || 0;
        if (level > 3) return renderPlainText(source, keyPrefix);

        const pattern = /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|\*\*(\S(?:[^\n]*?\S)?)\*\*|__(\S(?:[^\n]*?\S)?)__|`([^`\n]+)`|\*(\S(?:[^*\n]*?\S)?)\*/g;
        const nodes = [];
        let lastIndex = 0;
        let match;

        while ((match = pattern.exec(source)) !== null) {
            if (match.index > lastIndex) {
                nodes.push(renderPlainText(source.slice(lastIndex, match.index), `${keyPrefix}-t-${lastIndex}`));
            }
            const key = `${keyPrefix}-m-${match.index}`;
            if (match[2]) {
                nodes.push(h("a", { key, href: match[2], target: "_blank", rel: "noreferrer" }, match[1]));
            } else if (match[3] || match[4]) {
                nodes.push(h("strong", { key }, renderInlineMarkdown(match[3] || match[4], key, level + 1)));
            } else if (match[5]) {
                nodes.push(h("code", { key }, match[5]));
            } else if (match[6]) {
                nodes.push(h("em", { key }, renderInlineMarkdown(match[6], key, level + 1)));
            }
            lastIndex = pattern.lastIndex;
        }

        if (lastIndex < source.length) {
            nodes.push(renderPlainText(source.slice(lastIndex), `${keyPrefix}-t-${lastIndex}`));
        }

        return nodes;
    }

    function renderRichText(text, keyPrefix) {
        return (text || "").toString().split("\n").map((line, idx) => {
            const key = `${keyPrefix}-l-${idx}`;
            const prefix = idx > 0 ? "\n" : "";
            const heading = line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
            if (heading) {
                return h(React.Fragment, { key }, prefix, h("strong", null, renderInlineMarkdown(heading[2], key, 0)));
            }
            return h(React.Fragment, { key }, prefix, renderInlineMarkdown(line, key, 0));
        });
    }

    // Trennt einen abschliessenden "Quellen:"-Block vom Antworttext ab.
    function splitSourcesBlock(text) {
        const source = (text || "").toString();
        const lines = source.split("\n");
        for (let i = lines.length - 1; i >= 0; i--) {
            const match = lines[i].match(SOURCES_HEADING_PATTERN);
            if (!match) continue;
            const rest = [match[2]].concat(lines.slice(i + 1)).join("\n").trim();
            if (!/https?:\/\/|www\./i.test(rest)) break;
            return {
                body: lines.slice(0, i).join("\n").replace(/\s+$/, ""),
                label: match[1],
                sources: rest,
            };
        }
        return { body: source, label: "", sources: "" };
    }

    function renderMessageContent(text, options) {
        // Nutzertext wird nicht als Markdown interpretiert.
        if (options && options.plain) return renderPlainText(text, "plain");
        const parts = splitSourcesBlock(text);
        const nodes = [];
        if (parts.body.trim()) {
            nodes.push(h("div", { key: "body", className: "bubble-body" }, renderRichText(parts.body, "body")));
        }
        if (parts.sources) {
            nodes.push(h("div", { key: "sources", className: "sources" }, [
                h("div", { key: "label", className: "sources-label" }, `${parts.label || "Quellen"}:`),
                h("div", { key: "list", className: "sources-list" }, renderRichText(parts.sources, "sources")),
            ]));
        }
        return nodes;
    }

    function safeActionUrl(value) {
        const url = (value || "").toString().trim();
        return /^(https?:\/\/|mailto:|tel:|\/)/i.test(url) ? url : "";
    }

    function hasRichPayload(rich) {
        return !!(
            rich &&
            ((Array.isArray(rich.cards) && rich.cards.length) ||
                (Array.isArray(rich.actions) && rich.actions.length))
        );
    }

    function renderRichCard(card, key) {
        const imageUrl = safeActionUrl(card.image_url);
        const titleNode = card.url && safeActionUrl(card.url)
            ? h("a", { className: "rich-card-title", href: card.url, target: "_blank", rel: "noreferrer" }, card.title || "")
            : h("div", { className: "rich-card-title" }, card.title || "");
        return h("div", { key, className: "rich-card" }, [
            h("div", { key: "thumb", className: "rich-thumb" }, imageUrl
                ? h("img", { src: imageUrl, alt: card.title || "", loading: "lazy" })
                : null),
            h("div", { key: "body", className: "rich-card-body" }, [
                titleNode,
                card.description ? h("p", { key: "desc", className: "rich-card-desc" }, card.description) : null,
                Array.isArray(card.details) && card.details.length
                    ? h("div", { key: "details", className: "rich-detail-list" },
                        card.details.slice(0, 3).map((detail, idx) =>
                            h("span", { key: idx, className: "rich-detail" }, detail)
                        )
                    )
                    : null,
            ]),
        ]);
    }

    function renderRichPayload(rich, onAction, disabled) {
        if (!hasRichPayload(rich)) return null;
        const cards = (rich.cards || []).slice(0, 2).map((card, idx) => renderRichCard(card, `card-${idx}`));
        const actions = (rich.actions || []).slice(0, 3);
        return [
            ...cards,
            actions.length ? h("div", { key: "actions", className: "rich-actions" },
                actions.map((action, idx) =>
                    h("button", {
                        key: idx,
                        type: "button",
                        className: "rich-action-btn" + (idx === 0 ? " primary" : ""),
                        disabled,
                        onClick: () => onAction(action),
                    }, action.label || action.question || "Auswählen")
                )
            ) : null,
        ];
    }

    function renderChatMessage(message, idx, onAction, disabled) {
        const bubble = h("div", {
            key: "bubble",
            className: "bubble " + message.sender + (message.placeholderId ? " typing" : "")
        }, renderMessageContent(message.text, { plain: message.sender === "user" }));

        if (message.sender === "user" || !hasRichPayload(message.rich)) {
            return React.cloneElement(bubble, { key: idx });
        }

        return h("div", { key: idx, className: "message-group bot" }, [
            bubble,
            ...renderRichPayload(message.rich, onAction, disabled).filter(Boolean),
        ]);
    }

    function Sidebar({ activePage }) {
        const navItems = [
            { href: "/dashboard", label: "Dashboard", id: "dashboard", icon: "dashboard" },
            { href: "/stats", label: "Statistiken", id: "stats", icon: "stats" },
            { href: "/scraping", label: "Scraping & Index", id: "scraping", icon: "scraping" },
            { href: "/chat", label: "Chat", id: "chat", icon: "chat" },
            { href: "/memory", label: "Memory bearbeiten", id: "memory", icon: "memory" },
            { href: "/faqs", label: "FAQs", id: "faqs", icon: "faqs" },
            { href: "/pdf-upload", label: "PDF Upload", id: "pdf-upload", icon: "pdf" },
            { href: "/widget-design", label: "Widget Design", id: "widget-design", icon: "widget" },
            { href: "/integrate", label: "Integrieren", id: "integrate", icon: "integrate" },
            { href: "/usage", label: "Kosten", id: "usage", icon: "usage" },
            { href: "/login/", label: "Logout", id: "logout", icon: "logout", onClick: () => AuthState.logout() },
        ];

        return h("aside", { className: "sidebar" }, [
            h("div", { key: "header", className: "sidebar-header" }, [
                h("div", { className: "sidebar-title" }, "florianmatthias"),
            ]),
            h("ul", { key: "nav", className: "nav-list" },
                navItems.map(item =>
                    h("li", { key: item.id },
                        h("a", {
                            href: item.href,
                            className: "nav-item" + (activePage === item.id ? " active" : ""),
                            onClick: item.onClick ? (event) => { event.preventDefault(); item.onClick(); } : undefined,
                        }, [
                            h("span", { key: "icon", className: "nav-icon" }, h(Icon, { name: item.icon })),
                            item.label
                        ])
                    )
                )
            ),
        ]);
    }

    function ChatPage() {
        const [botSlug] = useState(AuthState.getBotSlug());
        const [chatMessages, setChatMessages] = useState([
            { sender: "bot", text: "👋 Hi! Ich bin dein AI-Assistent. Stelle mir eine Frage zum indexierten Inhalt." },
        ]);
        const [question, setQuestion] = useState("");
        const [chatLoading, setChatLoading] = useState(false);
        const chatLogRef = useRef(null);
        const placeholderTimers = useRef({});

        useEffect(() => {
            if (chatLogRef.current) {
                chatLogRef.current.scrollTop = chatLogRef.current.scrollHeight;
            }
        }, [chatMessages]);

        const startPlaceholder = () => {
            const id = `ph-${Date.now()}-${Math.random().toString(16).slice(2, 6)}`;
            const steps = [
                "🤔 Denke nach ...",
                "🔍 Suche im Index ...",
                "✍️ Formuliere Antwort ..."
            ];
            setChatMessages(prev => [...prev, { sender: "bot", text: steps[0], placeholderId: id }]);
            placeholderTimers.current[id] = steps.slice(1).map((txt, idx) =>
                setTimeout(() => {
                    setChatMessages(prev =>
                        prev.map(m => m.placeholderId === id ? { ...m, text: txt } : m)
                    );
                }, (idx + 1) * 1200)
            );
            return id;
        };

        const finishPlaceholder = (id, finalText, rich) => {
            (placeholderTimers.current[id] || []).forEach(clearTimeout);
            delete placeholderTimers.current[id];
            setChatMessages(prev => {
                let found = false;
                const updated = prev.map(m => {
                    if (m.placeholderId === id) {
                        found = true;
                        return { sender: "bot", text: finalText, rich };
                    }
                    return m;
                });
                if (!found && finalText) {
                    updated.push({ sender: "bot", text: finalText, rich });
                }
                return updated;
            });
        };

        const handleSend = async (textOverride) => {
            const text = (textOverride !== undefined ? textOverride : question).trim();
            if (!text) return;
            if (chatLoading) return;
            if (!botSlug.trim()) {
                setChatMessages((prev) => [...prev, { sender: "bot", text: "⚠️ Bitte zuerst einen Bot-Slug auf dem Dashboard eintragen." }]);
                return;
            }
            const historyPayload = chatMessages
                .filter((m) => !m.placeholderId)
                .slice(-CHAT_HISTORY_LIMIT)
                .map((m) => ({
                    role: m.sender === "bot" ? "assistant" : "user",
                    content: m.text,
                }));
            setChatMessages(prev => [...prev, { sender: "user", text }]);
            setQuestion("");
            setChatLoading(true);
            const placeholderId = startPlaceholder();
            try {
                const res = await fetch("/api/chat", {
                    method: "POST",
                    headers: AuthState.buildHeaders(true),
                    body: JSON.stringify({ question: text, history: historyPayload, bot_slug: botSlug.trim() }),
                });
                const data = await res.json();
                const reply = res.ok ? data.answer : data.error || "Fehler beim Chat.";
                finishPlaceholder(placeholderId, reply, res.ok ? data.rich : null);
            } catch (err) {
                console.error(err);
                finishPlaceholder(placeholderId, "❌ Netzwerkfehler oder Backend nicht erreichbar.");
            } finally {
                setChatLoading(false);
            }
        };

        const handleRichAction = (action) => {
            if (!action) return;
            const url = safeActionUrl(action.url);
            if (action.type === "link" && url) {
                window.open(url, "_blank", "noopener,noreferrer");
                return;
            }
            const nextQuestion = (action.question || action.label || "").toString().trim();
            if (nextQuestion) handleSend(nextQuestion);
        };

        if (!AuthState.isLoggedIn()) {
            window.location.href = "/login";
            return null;
        }

        return h("div", { className: "layout" }, [
            h(Sidebar, { key: "sidebar", activePage: "chat" }),
            h("div", { key: "content", className: "content" }, [
                h("div", { key: "hero", className: "hero" }, [
                    h("div", { className: "hero-badge" }, [
                        h("span", { className: "hero-badge-dot" }),
                        "Chat Interface"
                    ]),
                    h("h1", { className: "title" }, "AI Chat testen"),
                    h("p", { className: "subtitle" }, "Teste deinen Chatbot und stelle Fragen zu den indexierten Inhalten."),
                ]),

                h("div", { key: "chat", className: "card" }, [
                    h("h2", null, [h("span", { className: "card-icon" }, "💬"), "Konversation"]),
                    h("div", { className: "chat-box", style: { marginTop: 16 } }, [
                        h("div", { ref: chatLogRef, className: "chat-log" },
                            chatMessages.map((m, idx) => renderChatMessage(m, idx, handleRichAction, chatLoading))
                        ),
                        h("div", { className: "chat-controls" }, [
                            h("textarea", {
                                placeholder: "Schreibe eine Nachricht...",
                                value: question,
                                onChange: (e) => setQuestion(e.target.value),
                                onKeyDown: (e) => {
                                    if (e.key === "Enter" && !e.shiftKey) {
                                        e.preventDefault();
                                        handleSend();
                                    }
                                },
                            }),
                            h("button", {
                                // Ohne Wrapper landet das Click-Event als textOverride in handleSend.
                                onClick: () => handleSend(),
                                disabled: chatLoading,
                                style: { minWidth: 120 }
                            }, h("span", null, chatLoading ? "⏳ ..." : "📤 Senden")),
                        ]),
                    ]),
                ]),
            ]),
        ]);
    }

    ReactDOM.createRoot(document.getElementById("root")).render(h(ChatPage));
</script>
{% endblock %}
