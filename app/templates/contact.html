{% extends "base.html" %}
{% block title %}Kontakt - florianmatthias{% endblock %}

{% block content %}
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
  const { useEffect } = React;
  const h = React.createElement;

  const Icon = ({ name }) => {
    const props = { viewBox: "0 0 24 24", "aria-hidden": "true" };
    switch (name) {
      case "dashboard":
        return h("svg", props, [
          h("rect", { x: 3, y: 3, width: 8, height: 8, rx: 2 }),
          h("rect", { x: 13, y: 3, width: 8, height: 5, rx: 2 }),
          h("rect", { x: 13, y: 10, width: 8, height: 11, rx: 2 }),
          h("rect", { x: 3, y: 13, width: 8, height: 8, rx: 2 }),
        ]);
      case "stats":
        return h("svg", props, [
          h("path", { d: "M3 19h18" }),
          h("path", { d: "M6 16v-5" }),
          h("path", { d: "M12 16v-8" }),
          h("path", { d: "M18 16v-3" }),
        ]);
      case "scraping":
        return h("svg", props, [
          h("path", { d: "M21 12a9 9 0 1 1-3-6.7" }),
          h("polyline", { points: "21 3 21 9 15 9" }),
        ]);
      case "chat":
        return h("svg", props, [
          h("path", { d: "M6 6h12a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H10l-4 3v-3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z" }),
        ]);
      case "memory":
        return h("svg", props, [
          h("ellipse", { cx: 12, cy: 6, rx: 7, ry: 3 }),
          h("path", { d: "M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6" }),
          h("path", { d: "M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" }),
        ]);
      case "faqs":
        return h("svg", props, [
          h("circle", { cx: 12, cy: 12, r: 9 }),
          h("path", { d: "M9.5 9a2.5 2.5 0 0 1 5 0c0 1.6-2.5 1.9-2.5 4" }),
          h("path", { d: "M12 17h.01" }),
        ]);
      case "pdf":
        return h("svg", props, [
          h("path", { d: "M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" }),
          h("path", { d: "M14 3v5h5" }),
          h("path", { d: "M9 13h6" }),
          h("path", { d: "M9 17h6" }),
        ]);
      case "widget":
        return h("svg", props, [
          h("path", { d: "M4 6h16" }),
          h("circle", { cx: 9, cy: 6, r: 2 }),
          h("path", { d: "M4 12h16" }),
          h("circle", { cx: 15, cy: 12, r: 2 }),
          h("path", { d: "M4 18h16" }),
          h("circle", { cx: 7, cy: 18, r: 2 }),
        ]);
      case "integrate":
        return h("svg", props, [
          h("path", { d: "M10 13a3 3 0 0 0 4 0l3-3a3 3 0 0 0-4-4l-1 1" }),
          h("path", { d: "M14 11a3 3 0 0 0-4 0l-3 3a3 3 0 0 0 4 4l1-1" }),
        ]);
      case "usage":
        return h("svg", props, [
          h("rect", { x: 3, y: 5, width: 18, height: 14, rx: 2 }),
          h("path", { d: "M3 10h18" }),
          h("path", { d: "M7 15h5" }),
        ]);
      case "contact":
        return h("svg", props, [
          h("rect", { x: 4, y: 6, width: 16, height: 12, rx: 2 }),
          h("path", { d: "M4 7l8 6 8-6" }),
        ]);
      case "logout":
        return h("svg", props, [
          h("path", { d: "M4 5h7a2 2 0 0 1 2 2v3" }),
          h("path", { d: "M13 14v3a2 2 0 0 1-2 2H4" }),
          h("path", { d: "M10 12h10" }),
          h("polyline", { points: "16 8 20 12 16 16" }),
        ]);

      default:
        return h("svg", props);
    }
  };

  function Sidebar({ activePage }) {
    const navItems = [
      { href: "/dashboard", label: "Dashboard", id: "dashboard", icon: "dashboard" },
      { href: "/stats", label: "Statistiken", id: "stats", icon: "stats" },
      { href: "/scraping", label: "Scraping & Index", id: "scraping", icon: "scraping" },
      { href: "/chat", label: "Chat", id: "chat", icon: "chat" },
      { href: "/memory", label: "Memory bearbeiten", id: "memory", icon: "memory" },
      { href: "/faqs", label: "FAQs", id: "faqs", icon: "faqs" },
      { href: "/pdf-upload", label: "PDF Upload", id: "pdf-upload", icon: "pdf" },
      { href: "/widget-design", label: "Widget Design", id: "widget-design", icon: "widget" },
      { href: "/integrate", label: "Integrieren", id: "integrate", icon: "integrate" },
      { href: "/contact", label: "Kontakt", id: "contact", icon: "contact" },
      { href: "/login/", label: "Logout", id: "logout", icon: "logout", onClick: () => AuthState.logout() },
    ];

            return h("aside", { className: "sidebar" }, [
                h("div", { key: "header", className: "sidebar-header" }, [
                    h("div", { className: "sidebar-title" }, "florianmatthias"),
                ]),      h("ul", { key: "nav", className: "nav-list" },
        navItems.map(item =>
          h("li", { key: item.id },
            h("a", {
              href: item.href,
              className: "nav-item" + (activePage === item.id ? " active" : ""),
              onClick: item.onClick ? (event) => { event.preventDefault(); item.onClick(); } : undefined,
            }, [
              h("span", { key: "icon", className: "nav-icon" }, h(Icon, { name: item.icon })),
              item.label
            ])
          )
        )
      ),
    ]);
  }

  function ContactPage() {
    useEffect(() => {
      if (!AuthState.isLoggedIn()) {
        window.location.href = "/login";
      }
    }, []);

    return h("div", { className: "layout" }, [
      h(Sidebar, { key: "sidebar", activePage: "contact" }),
      h("div", { key: "content", className: "content" }, [
        h("div", { key: "hero", className: "hero" }, [
          h("div", { className: "hero-badge" }, [
            h("span", { className: "hero-badge-dot" }),
            "Kontakt aufnehmen"
          ]),
          h("h1", { className: "title" }, "Kontaktdaten"),
          h("p", { className: "subtitle" },
            "Hier erreichst du uns, falls der Assistent keine Antwort hatte."),
        ]),

        h("div", { key: "info", className: "card" }, [
          h("h2", null, [h("span", { className: "card-icon" }, "✉️"), "Kontakt"]),
          h("div", { className: "stack", style: { marginTop: 8, gap: 10 } }, [
            h("div", { className: "chip" }, [
              h("span", { style: { fontWeight: 800 } }, "E-Mail:"),
              h("a", { href: "mailto:{{ contact_email }}", style: { color: "inherit" } }, "{{ contact_email }}")
            ]),
            {% if contact_phone %}
            h("div", { className: "chip" }, [
              h("span", { style: { fontWeight: 800 } }, "Telefon:"),
              h("a", { href: "tel:{{ contact_phone }}", style: { color: "inherit" } }, "{{ contact_phone }}")
            ]),
            {% endif %}
            {% if contact_url %}
            h("div", { className: "chip" }, [
              h("span", { style: { fontWeight: 800 } }, "Web:"),
              h("a", { href: "{{ contact_url }}", target: "_blank", rel: "noreferrer", style: { color: "inherit" } }, "{{ contact_url }}")
            ]),
            {% endif %}
          ]),
          h("p", { className: "muted", style: { marginTop: 12 } },
            "Schreib uns bitte mit einem kurzen Hinweis zu deiner Frage, damit wir schneller helfen können."),
        ]),
      ]),
    ]);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(ContactPage));
</script>
{% endblock %}
