{% extends "base.html" %}
{% block title %}Kosten & Nutzung - florianmatthias{% endblock %}

{% block content %}
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
  const { useEffect, useState } = React;
  const h = React.createElement;

  const Icon = ({ name }) => {
    const props = { viewBox: "0 0 24 24", "aria-hidden": "true" };
    switch (name) {
      case "dashboard":
        return h("svg", props, [
          h("rect", { x: 3, y: 3, width: 8, height: 8, rx: 2 }),
          h("rect", { x: 13, y: 3, width: 8, height: 5, rx: 2 }),
          h("rect", { x: 13, y: 10, width: 8, height: 11, rx: 2 }),
          h("rect", { x: 3, y: 13, width: 8, height: 8, rx: 2 }),
        ]);
      case "stats":
        return h("svg", props, [
          h("path", { d: "M3 19h18" }),
          h("path", { d: "M6 16v-5" }),
          h("path", { d: "M12 16v-8" }),
          h("path", { d: "M18 16v-3" }),
        ]);
      case "scraping":
        return h("svg", props, [
          h("path", { d: "M21 12a9 9 0 1 1-3-6.7" }),
          h("polyline", { points: "21 3 21 9 15 9" }),
        ]);
      case "chat":
        return h("svg", props, [
          h("path", { d: "M6 6h12a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H10l-4 3v-3H6a3 3 0 0 1-3-3V9a3 3 0 0 1 3-3z" }),
        ]);
      case "memory":
        return h("svg", props, [
          h("ellipse", { cx: 12, cy: 6, rx: 7, ry: 3 }),
          h("path", { d: "M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6" }),
          h("path", { d: "M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6" }),
        ]);
      case "faqs":
        return h("svg", props, [
          h("circle", { cx: 12, cy: 12, r: 9 }),
          h("path", { d: "M9.5 9a2.5 2.5 0 0 1 5 0c0 1.6-2.5 1.9-2.5 4" }),
          h("path", { d: "M12 17h.01" }),
        ]);
      case "pdf":
        return h("svg", props, [
          h("path", { d: "M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" }),
          h("path", { d: "M14 3v5h5" }),
          h("path", { d: "M9 13h6" }),
          h("path", { d: "M9 17h6" }),
        ]);
      case "widget":
        return h("svg", props, [
          h("path", { d: "M4 6h16" }),
          h("circle", { cx: 9, cy: 6, r: 2 }),
          h("path", { d: "M4 12h16" }),
          h("circle", { cx: 15, cy: 12, r: 2 }),
          h("path", { d: "M4 18h16" }),
          h("circle", { cx: 7, cy: 18, r: 2 }),
        ]);
      case "integrate":
        return h("svg", props, [
          h("path", { d: "M10 13a3 3 0 0 0 4 0l3-3a3 3 0 0 0-4-4l-1 1" }),
          h("path", { d: "M14 11a3 3 0 0 0-4 0l-3 3a3 3 0 0 0 4 4l1-1" }),
        ]);
      case "usage":
        return h("svg", props, [
          h("rect", { x: 3, y: 5, width: 18, height: 14, rx: 2 }),
          h("path", { d: "M3 10h18" }),
          h("path", { d: "M7 15h5" }),
        ]);
      case "logout":
        return h("svg", props, [
          h("path", { d: "M4 5h7a2 2 0 0 1 2 2v3" }),
          h("path", { d: "M13 14v3a2 2 0 0 1-2 2H4" }),
          h("path", { d: "M10 12h10" }),
          h("polyline", { points: "16 8 20 12 16 16" }),
        ]);

      default:
        return h("svg", props);
    }
  };

  function Sidebar({ activePage }) {
    const navItems = [
      { href: "/dashboard", label: "Dashboard", id: "dashboard", icon: "dashboard" },
      { href: "/stats", label: "Statistiken", id: "stats", icon: "stats" },
      { href: "/scraping", label: "Scraping & Index", id: "scraping", icon: "scraping" },
      { href: "/chat", label: "Chat", id: "chat", icon: "chat" },
      { href: "/memory", label: "Memory bearbeiten", id: "memory", icon: "memory" },
      { href: "/faqs", label: "FAQs", id: "faqs", icon: "faqs" },
      { href: "/pdf-upload", label: "PDF Upload", id: "pdf-upload", icon: "pdf" },
      { href: "/widget-design", label: "Widget Design", id: "widget-design", icon: "widget" },
      { href: "/integrate", label: "Integrieren", id: "integrate", icon: "integrate" },
      { href: "/usage", label: "Kosten", id: "usage", icon: "usage" },
      { href: "/login/", label: "Logout", id: "logout", icon: "logout", onClick: () => AuthState.logout() },
    ];

            return h("aside", { className: "sidebar" }, [
                h("div", { key: "header", className: "sidebar-header" }, [
                    h("div", { className: "sidebar-title" }, "florianmatthias"),
                ]),      h("ul", { key: "nav", className: "nav-list" },
        navItems.map(item =>
          h("li", { key: item.id },
            h("a", {
              href: item.href,
              className: "nav-item" + (activePage === item.id ? " active" : ""),
              onClick: item.onClick ? (event) => { event.preventDefault(); item.onClick(); } : undefined,
            }, [
              h("span", { key: "icon", className: "nav-icon" }, h(Icon, { name: item.icon })),
              item.label
            ])
          )
        )
      ),
    ]);
  }

  function Metric({ label, value, sub, icon }) {
    return h("div", { className: "card", style: { padding: 16 } }, [
      h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center" } }, [
        h("div", { style: { fontSize: 13, color: "var(--text-muted)" } }, label),
        icon ? h("span", { style: { fontSize: 18 } }, icon) : null,
      ]),
      h("div", { style: { fontSize: 30, fontWeight: 800, marginTop: 6 } }, value),
      sub ? h("div", { style: { color: "var(--text-muted)", marginTop: 4, fontSize: 13 } }, sub) : null,
    ]);
  }

  function UsagePage() {
    const [botSlug] = useState(AuthState.getBotSlug());
    const [usage, setUsage] = useState(null);
    const [loading, setLoading] = useState(true);
    const [error, setError] = useState("");
    const [useLive, setUseLive] = useState(false);
    const [startDate, setStartDate] = useState("");
    const [endDate, setEndDate] = useState("");

    useEffect(() => {
      if (!AuthState.isLoggedIn()) {
        window.location.href = "/login";
        return;
      }
      loadUsage();
    }, []);

    const loadUsage = async () => {
      setLoading(true);
      setError("");
      try {
        const params = new URLSearchParams();
        params.set("bot_slug", botSlug || "");
        if (useLive && startDate) params.set("start_date", startDate);
        if (useLive && endDate) params.set("end_date", endDate);
        const url = useLive ? `/api/admin/usage/live?${params.toString()}` : `/api/admin/usage?${params.toString()}`;
        const res = await fetch(url, {
          headers: AuthState.buildHeaders(),
        });
        const data = await res.json();
        if (!res.ok) {
          setError(data.error || "Konnte Nutzung nicht laden.");
        } else {
          setUsage(data);
        }
      } catch (err) {
        console.error(err);
        setError("Netzwerkfehler beim Laden.");
      } finally {
        setLoading(false);
      }
    };

    const fmt = (n, digits = 0) => {
      if (n == null || Number.isNaN(n)) return "–";
      return Number(n).toLocaleString("de-DE", { minimumFractionDigits: digits, maximumFractionDigits: digits });
    };

    const perModel = usage?.items || [];

    return h("div", { className: "layout" }, [
      h(Sidebar, { key: "sidebar", activePage: "usage" }),
      h("div", { key: "content", className: "content" }, [
        h("div", { key: "hero", className: "hero" }, [
          h("div", { className: "hero-badge" }, [
            h("span", { className: "hero-badge-dot" }),
            "Kosten & Nutzung"
          ]),
          h("h1", { className: "title" }, useLive ? "OpenAI Kosten (Live, /v1/usage)" : "OpenAI Kosten (Schätzung)"),
          h("p", { className: "subtitle" },
            useLive
              ? "Direkt aus dem OpenAI /v1/usage Endpoint. Kosten werden lokal anhand der Preisliste berechnet."
              : "Basierend auf den letzten 1000 Chats, geschätzt mit 1 Token ≈ 4 Zeichen. Preise modellabhängig."),
        ]),
        error ? h("div", {
          style: { background: "var(--error-bg)", color: "var(--error)", padding: 12, borderRadius: 12 }
        }, error) : null,
        h("div", { className: "card" }, [
          h("h2", null, [h("span", { className: "card-icon" }, "⚙️"), "Quelle & Zeitraum"]),
          h("div", { className: "control" }, [
            h("label", { style: { display: "flex", alignItems: "center", gap: 10 } }, [
              h("input", {
                type: "checkbox",
                checked: useLive,
                onChange: (e) => setUseLive(e.target.checked),
                style: { width: 18, height: 18 }
              }),
              "Live Usage (OpenAI /v1/usage)"
            ]),
          ]),
          useLive ? h("div", { className: "control" }, [
            h("input", {
              type: "date",
              value: startDate,
              onChange: (e) => setStartDate(e.target.value),
              placeholder: "Startdatum"
            }),
            h("input", {
              type: "date",
              value: endDate,
              onChange: (e) => setEndDate(e.target.value),
              placeholder: "Enddatum"
            }),
          ]) : null,
          h("div", { className: "control" }, [
            h("button", { onClick: loadUsage }, h("span", null, loading ? "⏳ Lädt..." : "🔄 Aktualisieren")),
            usage && usage.source ? h("span", { className: "pill" }, `Quelle: ${usage.source}`) : null,
          ]),
          h("p", { className: "muted", style: { marginTop: 8 } },
            useLive
              ? "Live-Abfrage benötigt Usage-Freischaltung und gültigen OPENAI_API_KEY."
              : "Schätzung nutzt Chat-Events (keine direkten Billing-Daten)."),
        ]),
        h("div", { className: "grid" }, [
          h(Metric, { label: "Gespräche", value: fmt(usage?.total_chats), sub: useLive ? "Zeitraum" : "letzte 1000", icon: "💬" }),
          h(Metric, { label: "Beantwortet", value: fmt(usage?.answered), sub: "Status ok", icon: "✅" }),
          h(Metric, { label: "Input Tokens", value: fmt(usage?.est_input_tokens), sub: useLive ? "live" : "geschätzt", icon: "⬅️" }),
          h(Metric, { label: "Output Tokens", value: fmt(usage?.est_output_tokens), sub: useLive ? "live" : "geschätzt", icon: "➡️" }),
          h(Metric, { label: "Kosten (USD)", value: usage ? "$" + fmt(usage.est_cost_usd, 4) : "–", sub: usage ? (usage.model ? `Modell: ${usage.model}` : "Multi-Model") : "", icon: "💸" }),
        ]),
        perModel.length ? h("div", { className: "card" }, [
          h("h2", null, [h("span", { className: "card-icon" }, "📑"), "Aufschlüsselung pro Modell"]),
          h("div", { className: "summary-list" }, [
            h("div", { className: "summary-row" }, [
              h("span", null, "Modell"),
              h("span", null, "Input Tokens"),
              h("span", null, "Output Tokens"),
              h("span", null, "Kosten USD"),
            ]),
            ...perModel.map((m, idx) =>
              h("div", { key: idx, className: "summary-row" }, [
                h("span", null, m.model || "n/a"),
                h("span", null, fmt(m.input_tokens)),
                h("span", null, fmt(m.output_tokens)),
                h("span", null, "$" + fmt(m.cost_usd, 4)),
              ])
            ),
          ]),
        ]) : null,
        h("div", { className: "card" }, [
          h("h2", null, [h("span", { className: "card-icon" }, "ℹ️"), "Hinweis"]),
          h("p", { className: "muted" },
            useLive
              ? "Live-Daten stammen aus /v1/usage. Kosten werden lokal per Preisliste kalkuliert; Abweichungen zum echten Billing möglich."
              : "Schätzung nutzt Chat-Events (keine direkten Billing-Daten). Preise je 1k Tokens: "
              + (usage ? `Input ${usage.pricing.input} USD, Output ${usage.pricing.output} USD.` : "siehe Modellpreise.")
          ),
        ]),
      ]),
    ]);
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(UsagePage));
</script>
{% endblock %}
