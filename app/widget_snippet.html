<!-- Chatbot Widget Snippet -->
<style>
  #chatbot-widget {
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 9999;
    font-family: system-ui, -apple-system, sans-serif;
    --toggle-bg: linear-gradient(135deg, #0f766e, #0ea5e9);
    --toggle-color: #fff;
    --panel-bg: #0f172a;
    --panel-border: #1f2937;
    --panel-radius: 0;
    --panel-shadow: 0 28px 80px rgba(0, 0, 0, 0.35);
  }
  #chatbot-toggle {
    width: var(--icon-size-md, 64px);
    height: var(--icon-size-md, 64px);
    border-radius: 50%;
    border: none;
    background: var(--toggle-bg);
    color: var(--toggle-color);
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
  }
  #chatbot-toggle svg {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
    display: block;
  }
  #chatbot-panel {
    position: absolute;
    bottom: 64px;
    right: 0;
    width: 420px;
    max-width: 92vw;
    height: 520px;
    max-height: 80vh;
    background: var(--panel-bg);
    border-radius: var(--panel-radius);
    overflow: hidden;
    border: none;
    box-shadow: var(--panel-shadow);
    display: none;
  }
  #chatbot-panel iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  @media (max-width: 640px) {
    #chatbot-panel {
      width: 94vw;
      height: 70vh;
    }
  }
</style>

<div id="chatbot-widget">
  <button id="chatbot-toggle" aria-label="Chat öffnen/schließen">💬</button>
  <div id="chatbot-panel">
    <iframe
      src="https://rag-chatbot-mjmj.onrender.com/embed"
      title="AI Chat"
      sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox">
    </iframe>
  </div>
</div>

<script>
  (function () {
    const defaults = {
      embedUrl: "https://rag-chatbot-mjmj.onrender.com/embed",
      botSlug: "default",
      token: "",
      title: "",
      subtitle: "",
      icon: "",
      theme: {
        toggleBg: null,
        toggleColor: null,
        toggleIcon: null,
        panel: null,
        border: null,
        panelRadius: null,
        panelShadow: null,
        accent: null,
        bg: null,
        text: null,
        userBubble: null,
        userText: null,
        botBubble: null,
        botText: null,
      },
    };

    const cfg = {
      ...defaults,
      ...(window.ChatbotWidgetConfig || {}),
      theme: {
        ...defaults.theme,
        ...((window.ChatbotWidgetConfig || {}).theme || {}),
      },
    };

    const widget = document.getElementById("chatbot-widget");
    const toggle = document.getElementById("chatbot-toggle");
    const panel = document.getElementById("chatbot-panel");
    const iframe = panel.querySelector("iframe");

    const setVar = (name, value) => {
      if (value) widget.style.setProperty(name, value);
    };

    setVar("--toggle-bg", cfg.theme.toggleBg);
    setVar("--toggle-color", cfg.theme.toggleColor);
    setVar("--panel-bg", cfg.theme.panel);
    setVar("--panel-border", cfg.theme.border);
    setVar("--panel-radius", cfg.theme.panelRadius);
    setVar("--panel-shadow", cfg.theme.panelShadow);

    if (cfg.theme.toggleIcon) toggle.textContent = cfg.theme.toggleIcon;

    const params = new URLSearchParams();
    if (cfg.botSlug) params.set("bot_slug", cfg.botSlug);
    if (cfg.token) params.set("token", cfg.token);
    if (cfg.title) params.set("title", cfg.title);
    if (cfg.subtitle) params.set("subtitle", cfg.subtitle);
    if (cfg.icon) params.set("icon", cfg.icon);

    const themeParams = {
      accent: cfg.theme.accent,
      bg: cfg.theme.bg,
      panel: cfg.theme.panel,
      border: cfg.theme.border,
      text: cfg.theme.text,
      userBubble: cfg.theme.userBubble,
      userText: cfg.theme.userText,
      botBubble: cfg.theme.botBubble,
      botText: cfg.theme.botText,
    };

    Object.entries(themeParams).forEach(([key, value]) => {
      if (value) params.set(`theme_${key}`, value);
    });

    const baseUrl = cfg.embedUrl || defaults.embedUrl;
    iframe.src = `${baseUrl}?${params.toString()}`;

    toggle.addEventListener("click", () => {
      panel.style.display = panel.style.display === "block" ? "none" : "block";
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") panel.style.display = "none";
    });
  })();
</script>
